services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpasswod
      MYSQL_DATABASE: kedaikopi
    volumes:
      - ./db:/docker-entrypoint-initdb.d
    networks:
      - kedaikopi-net

  proxysql:
    image: proxysql/proxysql:latest
    container_name: proxysql_proxy
    ports:
      - "3306:3306"
    networks:
      - kedaikopi-net

  web:
    image: php:8.1-apache
    ports:
      - "80"
    volumes:
      - ./src:/var/www/html
    networks:
      - kedaikopi-net

networks:
  kedaikopi-net:
    driver: bridge
